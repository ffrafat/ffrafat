<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B9D"/>
      <stop offset=".5" stop-color="#C06CFF"/>
      <stop offset="1" stop-color="#4FACFE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B9D"/>
      <stop offset=".5" stop-color="#C06CFF"/>
      <stop offset="1" stop-color="#00F2FE"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
      .mono { font-family: 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      .up { opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .line { opacity: 0; animation: show .01s linear forwards; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- base -->
    <rect width="1200" height="380" fill="#0B0A1F"/>

    <!-- aurora blobs -->
    <g filter="url(#blur)" opacity=".85">
      <circle cx="180" cy="80" r="190" fill="#FF6B9D">
        <animateTransform attributeName="transform" type="translate" values="0 0;90 60;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="360" r="200" fill="#7B5CFF">
        <animateTransform attributeName="transform" type="translate" values="0 0;-110 -50;0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="60" r="200" fill="#00C9FF">
        <animateTransform attributeName="transform" type="translate" values="0 0;-70 80;0 0" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="370" r="140" fill="#43E97B" opacity=".55">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 -40;0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- darken for legibility + dotted texture -->
    <rect width="1200" height="380" fill="#0B0A1F" opacity=".42"/>
    <rect width="1200" height="380" fill="url(#dots)" opacity=".06"/>

    <!-- left: intro -->
    <g class="sans">
      <g class="up" style="animation-delay:.1s">
        <text x="64" y="104" fill="#E6EDF3" font-size="24" font-weight="500" opacity=".85">Hey there, I'm 👋</text>
      </g>
      <g class="up" style="animation-delay:.25s">
        <text x="60" y="180" fill="url(#name)" font-size="70" font-weight="800" letter-spacing="-1.5">Faisal F Rafat</text>
      </g>
      <g class="up" style="animation-delay:.4s">
        <text x="64" y="224" fill="#E6EDF3" font-size="22" font-weight="500">Tinkerer  ·  DIY Enthusiast  ·  Vibe Coder</text>
      </g>

      <!-- chips -->
      <g class="up" style="animation-delay:.55s" font-size="15" font-weight="600">
        <g transform="translate(64,262)">
          <rect width="128" height="38" rx="19" fill="#FF6B9D" fill-opacity=".16" stroke="#FF6B9D" stroke-opacity=".6"/>
          <text x="64" y="24.5" text-anchor="middle" fill="#FFB3CD">macOS apps</text>
        </g>
        <g transform="translate(204,262)">
          <rect width="150" height="38" rx="19" fill="#C06CFF" fill-opacity=".16" stroke="#C06CFF" stroke-opacity=".6"/>
          <text x="75" y="24.5" text-anchor="middle" fill="#DDB3FF">ESP32 gadgets</text>
        </g>
        <g transform="translate(366,262)">
          <rect width="112" height="38" rx="19" fill="#4FACFE" fill-opacity=".16" stroke="#4FACFE" stroke-opacity=".6"/>
          <text x="56" y="24.5" text-anchor="middle" fill="#A9D4FF">OpenWrt</text>
        </g>
        <g transform="translate(490,262)">
          <rect width="124" height="38" rx="19" fill="#43E97B" fill-opacity=".16" stroke="#43E97B" stroke-opacity=".6"/>
          <text x="62" y="24.5" text-anchor="middle" fill="#A6F5C2">Ham radio</text>
        </g>
      </g>
      <g class="up" style="animation-delay:.7s">
        <text x="66" y="336" fill="#9BA4B5" font-size="15">📍 Dhaka, Bangladesh   ·   rafat.cc</text>
      </g>
    </g>

    <!-- right: glass terminal -->
    <g class="up" style="animation-delay:.35s">
      <rect x="700" y="58" width="440" height="264" rx="18" fill="#0E0C24" fill-opacity=".72" stroke="url(#edge)" stroke-opacity=".7" stroke-width="1.5"/>
      <circle cx="728" cy="84" r="6" fill="#FF5F57"/>
      <circle cx="748" cy="84" r="6" fill="#FEBC2E"/>
      <circle cx="768" cy="84" r="6" fill="#28C840"/>
      <text x="920" y="89" text-anchor="middle" fill="#9BA4B5" font-size="13" class="mono">~/ffrafat — zsh</text>
      <line x1="700" y1="104" x2="1140" y2="104" stroke="#ffffff" stroke-opacity=".08"/>

      <g class="mono" font-size="15">
        <g class="line" style="animation-delay:.9s">
          <text x="726" y="138"><tspan fill="#43E97B">❯</tspan><tspan fill="#E6EDF3"> whoami</tspan></text>
        </g>
        <g class="line" style="animation-delay:1.3s">
          <text x="726" y="162" fill="#C06CFF">maker of small, useful things</text>
        </g>
        <g class="line" style="animation-delay:1.8s">
          <text x="726" y="196"><tspan fill="#43E97B">❯</tspan><tspan fill="#E6EDF3"> ls ~/projects</tspan></text>
        </g>
        <g class="line" style="animation-delay:2.2s">
          <text x="726" y="220" fill="#4FACFE"><tspan x="726">JBLControl</tspan><tspan x="866">CrossLauncher</tspan></text>
        </g>
        <g class="line" style="animation-delay:2.35s">
          <text x="726" y="244" fill="#4FACFE"><tspan x="726">BanglaBar</tspan><tspan x="866">rail-transit-app</tspan></text>
        </g>
        <g class="line" style="animation-delay:2.5s">
          <text x="726" y="268" fill="#FF6B9D"><tspan x="726">AllmonLink</tspan><tspan x="866">…and 40+ more</tspan></text>
        </g>
        <g class="line" style="animation-delay:2.9s">
          <text x="726" y="302"><tspan fill="#43E97B">❯</tspan></text>
          <rect x="744" y="289" width="9" height="17" fill="#E6EDF3" class="cursor"/>
        </g>
      </g>
    </g>
  </g>

  <!-- gradient outline -->
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".45" stroke-width="2"/>
</svg>
